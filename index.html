<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./tabStyle.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="Aluno.js" defer></script>
    <script src="Interface.js" defer></script>
    <script src="main.js" defer></script>
    <script src="Turma.js" defer> </script>
    <title>Sistema Escolar</title>
  </head>
  <body>
    
<!-- Botões para trocar de aba -->
<div class="tabs-container">
  <button
    class="tab-button active"
    id="btn-cadastrar"
    onclick="Interface.cadastrar()"
  >
    Cadastrar Aluno
  </button>

  <button
    class="tab-button"
    id="btn-listar"
    onclick="listarAluno()"
  >
    Listar Alunos
  </button>

  <button 
    class="tab-button"
    id="btn-turma"
    onclick="Interface.mostrarAbaTurmas()"
  >
    Cadastrar Turma
  </button>
</div>

<!-- Conteúdo da Aba 1: Cadastrar Aluno -->
<div id="tab-cadastrar" class="tab-content active">
  Nome: <input id="nome" type="text" />
  Nota 1: <input id="n1" type="text" />
  Nota 2: <input id="n2" type="text" />
  Nota 3: <input id="n3" type="text" />
  Turma: 
  <select id="select-turma">
    <option value="">Selecione uma turma...</option>
  </select>
  <button onclick="btnSalvar()" class="btn-salvar">Salvar Aluno</button>
</div>

<!-- Conteúdo da Aba 2: Listar Alunos -->
<div id="tab-listar" class="tab-content">
  <h3>Alunos Cadastrados</h3>
  <div id="alunos">
    <!-- A tabela gerada pelo Interface.js será inserida aqui -->
    <p>Nenhum aluno cadastrado ainda.</p>
  </div>
</div>

<!-- Conteúdo da Aba 3: Cadastrar Turma -->
<div id="tab-turma" class="tab-content">
  Curso: <input id="curso" type="text" />
  Professor: <input id="professor" type="text" />
  <button onclick="salvarTurma()" class="btn-salvar">Salvar Turma</button>
</div>
</body>
</html>
